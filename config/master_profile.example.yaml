guardrails:

  never_invent:
    - "Skills"
    - "Responsibilities"
    - "Achievements"
    - "Metrics"
    - "Employment dates"
    - "Job titles"
    - "Education"
    - "Certifications"
    - "Revenue"
    - "Profit"
    - "Cost savings"
    - "Team size"
    - "Performance percentages"

  never_overstate:
    - "Technical skills"
    - "Programming experience"
    - "Professional data science experience"
    - "Professional Qlik experience"
    - "SEO expertise"
    - "Google Ads expertise"
    - "Cosmetic formulation expertise"

  preserve_exactly:
    - "Employment dates"
    - "Degree status"
    - "Verified metrics"
    - "Official job titles"
    - "Ph.D. thesis-stage status"

  phd_rule: "Always describe the Ph.D. as thesis stage; never as completed"

  evidence_levels:
    VERIFIED: "Can be used directly"
    VERIFIED_WITH_CONTEXT: "Can be used when appropriate context is included"
    DO_NOT_USE: "Do not include in normal CV unless specifically requested"

  matching_rule: >
    Match jobs primarily using responsibilities, requirements and transferable
    experience rather than job title alone. Experience-year requirements should
    not automatically exclude a candidate when relevant transferable evidence exists.

  decision_rule: >
    The system should inform the user with evidence, direct matches,
    transferable matches and gaps. The system must not make the final
    application decision for the user.
